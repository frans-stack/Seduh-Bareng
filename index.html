<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seduh Bareng - Pesan Kopi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Seduh Bareng</h1>
        <p>Kopi segar, seduh langsung dari rumah.</p>
    </header>

    <main>
        <section class="menu-container" id="menu-list">
            <!-- Daftar menu akan dimuat otomatis oleh JavaScript -->
        </section>

        <section class="cart-container">
            <h2>Keranjang Pesanan</h2>
            <ul id="cart-items"></ul>
            <p class="total">Total: Rp <span id="total-price">0</span></p>
            
            <div class="customer-info">
                <input type="text" id="customer-name" placeholder="Nama Pemesan" required>
                <input type="text" id="customer-note" placeholder="Catatan (misal: Es sedikit, Gula aren)">
            </div>
            
            <button id="checkout-btn" onclick="checkoutWhatsApp()">Pesan via WhatsApp</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
